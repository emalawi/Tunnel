<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gini AI</title>
<style>
  * { box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: #f4f5f7;
    margin: 0;
    height: 100vh;
    display: flex;
    flex-direction: column;
  }
  header {
    background: #fff;
    border-bottom: 1px solid #e5e5e5;
    padding: 14px 20px;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  header h1 { font-size: 16px; margin: 0; }
  #statusDot {
    width: 8px; height: 8px; border-radius: 50%; background: #94a3b8;
    display: inline-block; margin-right: 6px;
  }
  #statusDot.online { background: #22c55e; }
  #statusDot.offline { background: #dc2626; }
  #statusText { font-size: 12px; color: #666; }

  #chatArea {
    flex: 1;
    overflow-y: auto;
    padding: 20px;
    max-width: 700px;
    width: 100%;
    margin: 0 auto;
  }
  .msg {
    max-width: 80%;
    padding: 10px 14px;
    border-radius: 12px;
    margin-bottom: 10px;
    font-size: 14px;
    white-space: pre-wrap;
    line-height: 1.4;
  }
  .msg.user {
    background: #2563eb;
    color: #fff;
    margin-left: auto;
    border-bottom-right-radius: 2px;
  }
  .msg.ai {
    background: #fff;
    border: 1px solid #eee;
    margin-right: auto;
    border-bottom-left-radius: 2px;
  }
  .msg.ai.typing::after {
    content: "▍";
    animation: blink 1s step-start infinite;
  }
  @keyframes blink { 50% { opacity: 0; } }

  form {
    display: flex;
    gap: 8px;
    padding: 16px;
    background: #fff;
    border-top: 1px solid #e5e5e5;
    max-width: 700px;
    width: 100%;
    margin: 0 auto;
    box-sizing: border-box;
  }
  textarea {
    flex: 1;
    resize: none;
    border: 1px solid #ddd;
    border-radius: 8px;
    padding: 10px 12px;
    font-size: 14px;
    font-family: inherit;
    max-height: 120px;
  }
  button {
    padding: 0 20px;
    background: #2563eb;
    color: #fff;
    border: none;
    border-radius: 8px;
    cursor: pointer;
    font-size: 14px;
    font-weight: 500;
  }
  button:disabled { background: #94a3b8; cursor: not-allowed; }
</style>
</head>
<body>

<header>
  <h1>Gini AI</h1>
  <span><span id="statusDot"></span><span id="statusText">Connecting...</span></span>
</header>

<div id="chatArea"></div>

<form id="chatForm">
  <textarea id="messageInput" placeholder="Message Gini AI..." rows="1"></textarea>
  <button type="submit" id="sendBtn">Send</button>
</form>

<script>
  const TUNNEL_JSON_URL = "https://raw.githubusercontent.com/Spacklight/Tunnel/main/config/tunnel.json";
  let tunnelUrl = null;

  const chatArea = document.getElementById("chatArea");
  const form = document.getElementById("chatForm");
  const input = document.getElementById("messageInput");
  const sendBtn = document.getElementById("sendBtn");
  const statusDot = document.getElementById("statusDot");
  const statusText = document.getElementById("statusText");

  function addMessage(role, text) {
    const div = document.createElement("div");
    div.className = `msg ${role}`;
    div.textContent = text;
    chatArea.appendChild(div);
    chatArea.scrollTop = chatArea.scrollHeight;
    return div;
  }

  async function refreshTunnelUrl() {
    try {
      const res = await fetch(TUNNEL_JSON_URL + "?t=" + Date.now());
      const data = await res.json();
      tunnelUrl = data.url;
      statusDot.className = "online";
      statusText.textContent = "Online";
      return true;
    } catch (err) {
      statusDot.className = "offline";
      statusText.textContent = "Offline";
      return false;
    }
  }

  async function sendMessage(message) {
    addMessage("user", message);
    const aiDiv = addMessage("ai", "");
    aiDiv.classList.add("typing");

    sendBtn.disabled = true;

    try {
      if (!tunnelUrl) {
        const ok = await refreshTunnelUrl();
        if (!ok) throw new Error("Could not reach tunnel");
      }

      const response = await fetch(tunnelUrl + "/chat/stream", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ message }),
      });

      if (!response.ok || !response.body) {
        throw new Error("Server did not respond");
      }

      const reader = response.body.getReader();
      const decoder = new TextDecoder();
      let buffer = "";

      while (true) {
        const { value, done } = await reader.read();
        if (done) break;

        buffer += decoder.decode(value, { stream: true });
        const lines = buffer.split("\n\n");
        buffer = lines.pop(); // keep incomplete chunk for next read

        for (const line of lines) {
          if (line.startsWith("data: ")) {
            const text = line.slice(6);
            if (text === "[DONE]") continue;
            aiDiv.textContent += text;
            chatArea.scrollTop = chatArea.scrollHeight;
          }
        }
      }
    } catch (err) {
      aiDiv.textContent = "Error: " + err.message + " — trying to reconnect...";
      await refreshTunnelUrl(); // tunnel URL may have changed, refresh for next try
    } finally {
      aiDiv.classList.remove("typing");
      sendBtn.disabled = false;
    }
  }

  form.addEventListener("submit", (e) => {
    e.preventDefault();
    const message = input.value.trim();
    if (!message) return;
    input.value = "";
    input.style.height = "auto";
    sendMessage(message);
  });

  input.addEventListener("keydown", (e) => {
    if (e.key === "Enter" && !e.shiftKey) {
      e.preventDefault();
      form.requestSubmit();
    }
  });

  input.addEventListener("input", () => {
    input.style.height = "auto";
    input.style.height = input.scrollHeight + "px";
  });

  refreshTunnelUrl();
</script>

</body>
</html>
